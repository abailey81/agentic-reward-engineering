#   freeze hash (`freeze.py::_BOUND_CONFIGS`). It contradicts the frozen design on two points:
#     • `evaluation.scheme: walk_forward` here — but the campaign runs ONE contiguous sealed split
#       (`single_sealed_split`, R43); walk-forward is deferred future work.
#     • `seeds.headline: [0,1,2,3,4]` and `dsr.trial_count_rule: all_candidates_all_arms` here are the
#       OLD 5-seed / all-candidates settings; the headline runs 30 winner seeds (D2) under the
