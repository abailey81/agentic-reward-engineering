minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # block accidental data commits (gold is gitignored anyway)
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        additional_dependencies: ["numpy", "types-PyYAML"]
        args: ["--ignore-missing-imports"]
        files: ^src/
  # Pre-registration freeze drift-guard. Runs ONLY when one of the nine hashed design artifacts
  # is staged: PREREGISTRATION.md, the bound configs, the two loaded prompt templates and the
  # feedback schema (the treatment surface). Read-only (`--check` never writes). Pre-freeze it
  # enforces prose-vs-yaml consistency; post-freeze it fails the commit if the recorded design
  # hash drifts. Definition of the hash: scripts/freeze.py.
  - repo: local
    hooks:
      - id: prereg-freeze-guard
        name: pre-registration freeze drift-guard (scripts/freeze.py --check)
        entry: python scripts/freeze.py --check
        language: system
        pass_filenames: false
        files: ^(PREREGISTRATION\.md|config/(preregistration|inference|environment|data|arms)\.yaml|prompts/(system|initial_generation)\.txt|src/feedback/schema\.py)$
