      N2_h2_ra:     {N1_h2_tail: 0.34, N3_h3: 0.33, N6_h1: 0.33}        # RA confirmed -> tail (co-primary) + iteration + beat-the-human
      N3_h3:        {N4_h4: 0.5, N6_h1: 0.5}
      N4_h4:        {N3_h3: 0.34, N5_structure: 0.33, N6_h1: 0.33}
