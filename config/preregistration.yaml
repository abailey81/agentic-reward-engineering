  spend_ceiling_usd: 30                          # ADVISORY planning ceiling (R83 softening, Tamer 2026-07-21): tracked + reported, WARNS at thresholds, NEVER refuses — spend decisions are the researcher's; the exogenous stops are the seed-rung rule + the calendar gate
  spend_priority: [opus-confirmatory, legs-in-queue-order, m2-open-models, m2-closed-models]   # the execution/reporting order (advisory; no automatic trimming)
  synthesis:                                     # pre-registered cross-leg synthesis (report-only)
    sign_count: descriptive                      # cross-leg replication count reported DESCRIPTIVELY (legs share panel+CRN seeds -> not independent)
    permutation_test: "per shared CRN seed, flip the (distributional<->scalar) assignment with p=0.5 SIMULTANEOUSLY across all legs; STATISTIC = the POOLED MEAN difference over included legs (the multivariate paired sign-flip test; refined pre-freeze 2026-07-21 — a sign-COUNT statistic is near-powerless under joint flips with correlated legs, unanimity being routine under that null; the sign count remains the DESCRIPTIVE layer); 10,000 reps, one-sided toward dist-safer (shared-seed/panel dependence lives inside the null)"
    # R84 (2026-07-21): the capability anchor CONCRETELY pre-declared — a rule, not a choice.  #
    capability_anchor:
      # ★ DOWN-RANK REGISTERED 2026-07-26 (ratification item 7b; Tamer + Okhrati). The retrieval rule
      # below is discretion-free and yielded values for only 2 of the 10 legs, so the "primary capability
      # regression" is a line through TWO points: zero residual degrees of freedom, no estimable slope
      # uncertainty, no testable gradient. The FALLBACK was already pre-declared (secondary M2 + tertiary
      # ordinal pairs), so nothing was hidden -- but the register called this instrument PRIMARY while
      # docs/VALIDITY_TIER_DESIGN_2026-07-26.md called it DEAD and proposed a down-rank that was
      # registered NOWHERE. R87's falsifiability cannot rest on a non-estimable regression, so the
      # hierarchy is now stated explicitly rather than left contradictory.
      instrument_hierarchy_for_r87:
        primary: [family_pair_did_qwen_9b_27b, family_pair_did_haiku_opus, m2_probe_grid]   # the IDENTIFIED estimates + the probe grid carry R87's decision
        descriptive_only: swe_bench_verified_regression   # retained and reported, but NOT a decision instrument at n=2
        rationale: "2 of 10 legs carry a card-published SWE-bench-Verified score under the discretion-free rule (glm-5.2 publishes SWE-bench-PRO; deepseek-v4-pro's circulating 80.6 is the MAX-mode figure our pinned pro-mode leg does not use; sonnet-5/qwen3.5-9b/nemotron/gemini-flash publish none; gpt-5.6-luna documented ABSENT). A 2-point regression has no residual df, so reading a GRADIENT off it would be an artefact. The pair DiDs are the CONTROLLED capability instrument (within-family, everything else held) and were always the identified estimates -- this makes the register say so."
        never_imputed: true                    # the discretion-free rule stands: a missing score is MISSING, never imputed, never swapped for a different benchmark
      primary: swe_bench_verified            # ONE named benchmark (the lineage-standard coding axis) -- see instrument_hierarchy_for_r87 above: DESCRIPTIVE since the 2026-07-26 down-rank
      # ⚠ ESTIMABILITY, stated plainly (deep review 2026-07-26, loop 7). The discretion-free retrieval rule
      # below yielded values for only 2 of the 10 legs, so the "primary capability regression" is a line
      # through TWO points: zero residual degrees of freedom, no estimable slope uncertainty, no testable
      # gradient. The FALLBACK is genuinely pre-declared in `primary_rule` + `values_at_freeze` (secondary
      # M2 + tertiary ordinal pairs carry the rest), so nothing here is hidden — but calling this instrument
      # "primary" while it cannot be estimated overstates it, and R87's falsifiability therefore rests in
      # practice on the two family-pair DiDs + the M2 probe grid, NOT on this regression.
      # `docs/VALIDITY_TIER_DESIGN_2026-07-26.md` reaches the same conclusion ("the anchor is DEAD (2/10
      # legs)") and PROPOSES down-ranking it to the pair-DiDs — but that down-rank is registered in NO
      # amendment row and NO key here, so the register and the design doc currently disagree. Registering
      # the down-rank is a design change (Tamer/Ramin), so it is SURFACED here rather than made silently.
      primary_rule: "value = the SWE-bench-Verified score published on the model's official card / vendor announcement as of the retrieval date below; a model with NO such published score is MISSING — excluded from the primary regression and reported under the secondary anchor instead (never imputed, never swapped for a different benchmark)"
      retrieval: {date: "2026-07-20 (MODEL_SWEEP_2026-07-20_v2) re-verified at gate time pre-freeze", archive: "per-model source URL + score archived with the gate verdicts"}
      values_at_freeze: {qwen3.6-27b: 77.2, haiku-4.5: 73.3}         # R93 (retrieval 2026-07-22, rule applied discretion-free): ALL OTHER LEGS = MISSING under the primary rule — glm-5.2 publishes SWE-bench-PRO not Verified; deepseek-v4-pro's circulating 80.6 is the MAX-mode figure while our leg pins the pro mode (nee think-high, vendor-renamed 2026-07-23; conflation refused - the sweep register warned exactly this); sonnet-5/qwen3.5-9b/nemotron/gemini-flash have no card-published SWE-V; gpt-5.6-luna documented ABSENT -> the primary regression runs on the available points and the registered secondary (M2) + tertiary (ordinal pairs) carry the rest, as pre-declared
      secondary: m2-reading-score            # OUR instrument — shares method variance with the outcome (circularity DISCLOSED; that is why it is secondary, never primary)
      tertiary_descriptive: within-family-ordinal   # parameter/tier order inside each family pair (9B<27B; Haiku<Sonnet<Opus) — benchmark-free, zero missing; embodied by the pair contrasts
    # R87 (2026-07-21): the gradient prediction made FALSIFIABLE — three rival signatures named   #
    # ex-ante (the prior wording "monotone non-decreasing" was satisfied by BOTH a flat and a     #
    # rising gradient — near-unfalsifiable — and named the RIVAL account's signature, not ours).  #
    gradient_signatures:
      capacity_account: "responsiveness RISES with capability (weak authors fail to use the numbers; strong ones use them)"
      representational_account: "responsiveness FLAT at ~0 across capability — THE REGISTERED PREDICTION of the numeracy-bottleneck headline (the bottleneck is the numeric REPRESENTATION, so it binds every author incl. the frontier; the legibility/guided-comparison probes, not capability, are the predicted levers)"
      echo_account: "responsiveness DECREASING in capability (weaker models surface-echo fed numbers without using them)"
      decision: "read off jointly from the capability regression + both family-pair DiDs + the M2 probe grid; the fingerprint accounts A1-A5 adjudicate as registered"
    sonnet_bridge_prediction: "WITHDRAWN pre-data by R92 (2026-07-21): the prediction was defined on the pilot's author (sonnet-4.6), whose leg was removed on Tamer's instruction; no re-scoping to another model (that would dilute the ex-ante falsifiability). The withdrawal is dated and pre-data — the prototype remains engineering-only evidence"
    pair_contrast: "the content-effect x capability interaction, estimated within BOTH family pairs (Qwen 9B/27B open; Haiku/Opus closed) — the controlled capability instrument; the cross-family regression is DESCRIPTIVE (n=10 legs carries no meaningful test power) — the pair DiDs are the identified estimates"
