  band_heavy_end: univ4                 # Shumway -30/-55 = the M&A-CONTAMINATED heavy end (R39) + terminal DOUBLE-COUNT (ADR-051), NOT the tail truth
  corrected_panel_executed: univ5s      # ADR-051 (2026-07-02) SUPERSEDES the planned univ4r: observed-terminal recovery, 333/333 vendor_terminal_kept, ZERO surcharges -> univ5s == univ5 byte-identically
  resolves: ADR-024                     # R33 -> R44 -> R73: liquidate_to_cash IS the band-bracketed headline; the corrected panel EQUALS it
