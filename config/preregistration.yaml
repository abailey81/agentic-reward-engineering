    ratified_by: [tamer, okhrati]                        # R108
    ratified_utc: "2026-07-26"                           # R108. (The trailing fragment here read "R108Until ratified, R31 is the disclosed operative default." -- a mangled splice of the pre-ratification note into the ratification stamp. Cleaned 2026-07-27 pre-freeze: ratification HAPPENED, so the R31-until-ratified caveat no longer applies and must not be sealed into the frozen record.)
    method: graphical_bretz_maurer_brannath_posch_2009    # bretz2009graphical; a shortcut for a closed test (marcus1976closed) -> strong FWER at alpha
    alpha: 0.05
    fwer_control: strong                        # H2 IUT internals UNTOUCHED (berger1982iut); the graph governs cross-hypothesis alpha-flow ONLY
