      N4_h4:        {test: h4_llm_gt_search_iut, comparators: [random_search, bayes_opt, cma_es, tpe], direction: one_sided}   # IUT over the 4-optimiser portfolio = beat-the-MAX (best black-box optimiser at matched budget); size<=alpha for ANY portfolio size (berger1982iut) -> one valid p-value, ZERO added family-wise multiplicity
      N5_structure: {test: distributional_gt_placebo_shuffled, metric: cvar, level: 0.05, direction: one_sided_content_over_format, arm_b: placebo_shuffled}   # 2026-07-26 UPGRADE: the tail effect is CONTENT not FORMAT (deepens the mechanism headline); forking-path-clean (never ran in the 6-arm prototype)
      N6_h1:        {test: llm_beats_best_human_reward, direction: one_sided_llm_better, method: intersection_union_over_canon, comparator: full_11name_hand_reward_canon, champion: best_human_is_max_over_canon_no_selection, endpoint: sharpe_annualized}   # ⚠ ENDPOINT CORRECTED 2026-07-26 (deep review, loop 5) — it registered `deflated_sharpe`, which the code NEVER computed (scripts/analyze_campaign.py builds the IUT legs from annualised per-seed Sharpe). The CODE is the correct side, MEASURED at the executed test length T=1571: a DSR endpoint scores the winner against an E[max SR] benchmark of 0.83 ANNUALISED (n_trials=30) while scoring each hand reward against 0.0 (n_trials=1) — DIFFERENT nulls per arm, so their paired difference is not a comparison of the same quantity — and the winner then loses every leg even at an equal or better true Sharpe (ann_SR 0.50 -> baseline DSR 0.91 vs winner 0.235; ann_SR 1.00 -> 0.993 vs 0.656), i.e. the IUT could essentially never reject. DSR is also a bounded probability that saturates on a 1571-session window. ALSO: the DSR-deflation RATIONALE was misapplied — deflation corrects for reporting the max of N strategies on the SAME data, but selection happens on VALIDATION (run_campaign selects on val_fitness; held_out_fitness refuses a non-val split) and the test leg is SEALED, so there is no test-set max-over-N to deflate. The genuine residual asymmetry (LLM winner = best of 30 validation candidates vs each hand reward = one fixed specification) FAVOURS THE LLM and is disclosed as the un-tuned-baseline bias (CH6). Using the same annualised Sharpe as the H2 legs also keeps H1/N6 and the headline on one shared inference tool. The endpoint choice is part of what ratification covers.   # 2026-07-26 (Tamer "make it beat the HUMAN, smart + strongly-backed"): the CLAIM = "the LLM-designed reward beats the BEST human-crafted reward". FORMALIZED as an INTERSECTION-UNION TEST (berger1982iut): the best human == max over the canon, and (LLM > max) <=> (LLM beats EVERY member), so the node rejects iff the LLM beats all 11 hand-rewards each at level alpha. This makes "the best human" PRECISE without cherry-picking which reward is best -- and that cherry-pick, taken on the sealed test, IS the White-2000 data-snoop that forced the OLD H1 to descriptive-only. The IUT is snoop-free, level-alpha for free (Berger 1982), conservative, and consistent with the H2 co-primary IUTs. Canon-as-champion: the LLM clears the ENTIRE standard hand-reward toolkit, not one cherry-picked baseline (a first in the LLM-reward-design lineage). SUPERSEDES the val-select framing, which was DEAD CODE: the baseline TEST stage archives val_fitness=NaN (run_campaign._baseline_winner_record), so beat_human_baseline fell back to a test-snoop; the IUT needs NO baseline val-roll -> the fragility is DISSOLVED, not patched.
    initial_weights: {N1_h2_tail: 0.5, N2_h2_ra: 0.5, N3_h3: 0.0, N4_h4: 0.0, N5_structure: 0.0, N6_h1: 0.0}   # ALL alpha starts on the H2 headline: N3/N4/N5/N6 begin at weight 0 and activate ONLY on upstream success, so PROMOTING them costs the headline nothing relative to a graph that had given them initial weight. # ^^ HONEST BASELINE CORRECTION (deep review 2026-07-26): the earlier note said "ZERO headline power cost" full stop, which compares against the wrong baseline. The OPERATIVE default is R31 -- H2-RA and H2-Tail as SEPARATE ESTIMANDS, each an IUT decided at the FULL one-sided alpha=0.05 (PREREGISTRATION.md §1 H2, "two-tier verdict"). Under this graph each co-primary is instead tested at w_i*alpha = 0.5*0.05 = 0.025. That IS a headline power cost: a one-sided leg powered to 0.80 at alpha=0.05 falls to 0.7007 at alpha=0.025 (verified numerically, normal approximation). It is the price of STRONG FWER across the whole six-node family, and it may well be worth paying -- but it is not zero, and ratifiers must accept the trade explicitly (already listed in ratification_pending: alpha_allocation).
