# Machine-readable mirror of PREREGISTRATION.md. FROZEN at end of Phase 1; scripts/freeze.py hashes
# it into docs/DECISION_LOG.md and asserts it agrees with the prose record. Changes after freeze
# require a dated amendment entry.
frozen: true                       # R115 UNFREEZE (2026-07-28, Tamer): v2.0 (4f90ecc4, frozen 07-28T00:05Z, tag prereg-v2.0) LIFTED **PRE-DATA** to register the winner-eligibility execution floor. Condition met exactly as ADR-059: the first execution attempt (RUN 1) was invalidated by a driver defect and is DISCARDED WHOLESALE, RUN 2 held ZERO records, and NO arm contrast of any kind had ever been computed (only H1 baselines had scored records). The sealed 2020-2026 test leg is untouched. All v2.0 records preserved as history: tag prereg-v2.0, docs/prereg-v2.0.sha256. (Chain: v1.0 ce5db62c frozen 07-18 -> lifted 07-20 ADR-059/R78; 07-22 ccf2e76f R93 lifted same-day R94; v2.0 frozen 07-28T00:05Z -> lifted 07-28 R115/ADR-062.)
freeze_hash: 3ca6f01ab7724d47bd5d01bc9e73b4d3150c049e1048dd86a864b400a230432f                   # v2.0 hash was 4f90ecc47cc6a779d63b74fdaa9667f967473365863fb615401694131ca136fd (preserved in docs/prereg-v2.0.sha256 + tag prereg-v2.0); re-stamped by the v2.1 freeze
phase0_smoke_passed_log_id: "DECISION_LOG.md#PHASE-0 (GREEN 2026-06-17)"   # precondition MET (P2; CPU m≈18.9/25.9)

hypotheses: [H1, H2, H3, H4]          # H2 headline; secondary = SAC-vs-TQC critic
contribution_axis: feedback_channel   # audit A-1: agent fixed (SAC), feedback varies

arms: [distributional, scalar, placebo, scalar_cvar5, placebo_shuffled, random_search, bayes_opt, cma_es, tpe]   # 9 arms (2026-07-26: +cma_es/tpe = the H4 optimiser portfolio, N4 confirmatory); placebo_shuffled = the R32 structure-vs-content control (V1 reconcile 2026-06-26: was silently missing from the frozen roster while the campaign ran 7). DISJOINT from the m=6 testing family.
matched_budget: 30
# Amendment E1 (2026-07-10, supervisor-approved; PREREGISTRATION §6/§12 + amendment record): per-arm
# WINNER seed count is the ASSURANCE-TIER LADDER (mode: tiered), resolving to the flat set [0..567].
# SEARCH budget untouched (1 seed per candidate during search; only the winners re-run at these seeds —
# the seeds-on-winners lever, ADR-023). Cumulative, order-only tiers (CRN preserved, each a COMPLETE
# study; truncation falls back to the largest COMPLETED rung): 30 core / 100 sigma-precision /
# 189 point-estimate power / 279 (80%) / 340 (90%) / 403 (95%, primary target) / 568 (99%). Stopping
# tier is EXOGENOUS (measured throughput vs deadline, never results) -> the single look is preserved.
seeds: {mode: tiered, tiers: [30, 100, 189, 279, 340, 403, 568]}
# R111 (2026-07-26): the H1 hand-reward CANON climbs the ladder with every other test unit, so N6's
# effective n EQUALS the achieved rung. Registered explicitly because R108 promoted N6 from
# report-only to CONFIRMATORY, and the floor-30 ruling it would otherwise inherit was taken while it
# was still report-only. Load-bearing fact: each IUT leg tests on the seed INTERSECTION of winner and
# baseline (scripts/analyze_campaign.py ~5796-5806), so canon depth CAPS N6 — pinning it at 30 would
# leave a confirmatory node 4.35x less sensitive than its siblings (MDE 0.1675 vs 0.0385 annualised
# Sharpe). Already costed: src/cluster/lanes._TEST_UNITS_PER_RUNG = 71 = 9 core + 50 leg + 11 canon + 1
# H3, and total_trainings(568) = 42,128 matches this ladder exactly.
canon_seed_depth: climbs_with_ladder    # NOT pinned to the 30-seed floor; n(N6) == achieved rung

tail_diagnostic_set:                  # measured on TRAINING returns; empirical body + EVT tails
  cvar_levels: [0.25, 0.10, 0.05, 0.01]   # cvar_01 retained but FLAGGED high-variance (B-7)
  evt_levels:  [0.05, 0.01]               # GPD fit for the extremes
  extras: [left_tail_mass, robust_skew]
  reliability_diagnostic: dropped_from_headline   # crossing-rate kept only for optional neural instrument
  moors_kurtosis: excluded
measurement_split: train              # audit B-2
estimator: {body: empirical, tails: gpd_evt}      # audit B-1

# R114 (2026-07-27): the RENDERED PRECISION of the fed block is a REGISTERED DESIGN PARAMETER, not an
# implementation detail. The designer never sees a float — it sees a STRING — so quantization is part
# of the stimulus, and an unregistered default silently decides how much of the manipulated variable
# survives to the model. Bound into the canonical hash via src/feedback/schema.py (#97).
fed_rendering:
  scalar_header_decimals: 6      # "Your previous reward scored: {:.6f} (validation Deflated Sharpe)"
  tail_line_decimals: 4          # every fed tail scalar, signed fixed-point
  notation: fixed_point_never_scientific   # scientific notation is a known LLM numeracy hazard
  legible_resolution_parity: required      # the legible re-rendering must resolve EXACTLY as finely as
                                           # the raw one, so the SQ3b ablation varies ENCODING only
  bound_by: src/feedback/schema.py         # hash-bound in freeze.py _BOUND_TREATMENT since 2026-07-27
  rationale: "Set from MEASUREMENT, not taste. HEADER: at the previous .2f the scalar arm's ENTIRE
    feedback content collapsed — 229/240 archived val_fitness values (95.4%) rendered literally '0.00'
    and 240 candidates produced just 4 DISTINCT strings (median fitness 0.000243, ~5x below the .2f
    quantization step); .4f still zeroes 24.2%, .6f zeroes 0.8% and yields 94 distinct strings. Since
    the scalar arm is the PRIMARY H2 COMPARATOR, .2f would have contrasted the tail vector against a
    near-CONSTANT rather than against a scalar performance number — a construct-validity failure, and
    one that makes H2 easier to 'win' for the wrong reason. TAIL LINES: amendment R76 measured the
    PAIRED candidate-to-candidate diff-SE of a fed CVaR-5% at 1e-4 (sibling-close books) to 8e-4
    (structurally different books); the old .3f quantization step of 1e-3 was LARGER THAN THAT ENTIRE
    RANGE, rendering 90.1%/70.1%/20.2% of pairs separated by 1e-4/3e-4/8e-4 as the SAME STRING, versus
    0.0% at .4f. That also repairs the registered A2-vs-A5 adjudication, whose A5 branch presumes the
    designer SEES a small delta and defensibly discounts it — at .3f there was frequently no delta on
    the page at all, a third state the ladder does not name. .5f is REJECTED as false precision: the
    MARGINAL sampling SE of a fed CVaR-5% is ~3.3e-3, and 1e-5 would also break legible parity because
    the legible arm renders integer basis points (1 bps = 1e-4). PARITY: before the fix the legible
    re-rendering resolved COARSER than raw on two of six fields (robust_skew +.2f collapsed 277
    distinct values to 14; left_tail_mass .1f%% collapsed 54 to 18), so a measured 'legibility effect'
    would have been partly INFORMATION LOSS — biased toward a spurious null. Now exact parity on all
    six. IDENTIFICATION UNAFFECTED: the renderer is common-mode across every arm, so arms still vary
    ONLY the feedback CONTENT; what changes is that the scalar comparator is no longer crippled, which
    makes the H2 contrast a fairer and HARDER test. Pre-data and pre-freeze."

fitness:
  metric: validation_deflated_sharpe  # reward-independent (audit B-3)
  lambda_cvar: 0.0                     # optional -lambda * validation CVaR
  selection_split: val
  # R115 (2026-07-28) — WINNER-ELIGIBILITY EXECUTION FLOOR. Selection was max(val_fitness) with NO
  # execution-quality condition, so a candidate whose authored reward RAISED on much of its training
  # (the R66 neutral fallback standing in, counted by `train_safe_default_count`) could be frozen —
  # and the sealed leg then RE-TRAINS that reward and inherits the contamination. Under H2 that
  # confounds the arm contrast with EXECUTION QUALITY, when identification requires the arms to
  # differ ONLY in the authored reward. A candidate is ELIGIBLE iff
  #     train_safe_default_count / train_safe_call_count < winner_max_fallback_frac
  # and the winner is max(val_fitness) among the eligible. If an arm has NO eligible candidate the
  # run FAILS LOUD rather than silently promoting a contaminated one.
  # EFFECT-BLIND BY CONSTRUCTION: reads an execution counter only — never val_fitness, test_sharpe,
  # test_cvar or any performance quantity — so it cannot be steered toward an outcome, and none
  # existed when it was registered.
  # THRESHOLD-INSENSITIVE, not tuned: over 613 counter-carrying records the distribution is strongly
  # bimodal — worst trace 0.41 %, mildest severe 39.40 %, a 96x EMPTY GAP — so any value in ~1-35 %
  # partitions the data identically. See PREREGISTRATION.md R115 and ADR-062.
  winner_max_fallback_frac: 0.10

loop: {runs: once, cpcv_on: winners, per_candidate_budget: fixed}   # audit B-3, B-5
# R74 (2026-07-02): B* from the Split-C convergence pilot — R70's extend-until-converged criterion is
# structurally unsatisfiable on this workload (eval flat-within-noise 25k..350k on BOTH ladders; the
# detector's tolerance scales with the curve's own range -> collapses on a flat curve). Totality of
# evidence: critic steep descent done by 100k (0.59->0.10), 350k nominally WORSE than 200k (overfit
# direction), ~17 buffer passes at 200k. Mirrors campaign.yaml + algos.yaml (budget-mirror guard).
train_steps_per_candidate: 400000  # R77 (2026-07-18): raised to the measured knee by the pre-committed extended-curve rule (see PREREGISTRATION.md R77; verdict artifact outputs/tables/bstar_rule_verdict.json)

# R107 (2026-07-26, RATIFIED by Tamer) — the EXECUTED thread regime. NOT a design/statistical
# parameter: no hypothesis, arm, budget, seed, fitness or analysis value changes. It is registered
# because multi-threaded BLAS changes the ORDER of float reductions, so the thread count is part of
# the DETERMINISM ENVELOPE (docs/MAX_THROUGHPUT_RUN_PLAN.md's pre-committed bench-then-ratify rule).
# Split justification is MEASURED IN BOTH DIRECTIONS (jobs 17784/17836): one training scales 2.72x
# at 8 threads and REGRESSES to 2.11x at 16, while 8 cores as 8x 1-thread trainings give ~104
# steps/s aggregate vs ~35 for one 8-thread training. Hence: threads where LATENCY binds, cores
# where THROUGHPUT binds. Confined to the SEARCH/chain leg, so every SCORED comparison (all paired
# contrasts, all CRN pairing) stays on the uniformly 1-thread TEST leg.
execution:
  chain_thread_count: 8            # sequential chains ONLY (bayes_opt GP-EI, LLM reflection, TPE/CMA-ES)
  test_leg_thread_count: 1         # the scored leg — NEVER change: CRN bit-exactness lives here
  chain_thread_count_max: 8        # 16 measured SLOWER than 8 (small-matmul oversubscription)
  thread_regime_recorded_in: "scripts/capture_env.py -> determinism_env.{OMP,MKL,OPENBLAS,NUMEXPR}_NUM_THREADS + torch_cuda.num_threads (so a heterogeneous regime is DETECTABLE by audit, not merely improbable)"

# R19 (2026-06-20): de-duped the mislabelled spy_buy_and_hold (== 1/N, no index in the anonymised panel)
# and expanded to 8 DISTINCT published allocators. 2026-07-26: +min_cvar (the CVaR-optimal / TAIL-optimal
# allocator, Rockafellar-Uryasev 2000) = 9 -- the classical tail-optimizer, so the report-only comparison now
# reads "the LLM's tail-aware reward beats even the benchmark that optimises the very tail it targets"
# (comparator-canon research; report-only, DSR-deflated at N=1 like the others; the 8-name audit LEAVE-ALONE
# stands -- min_cvar is the ONE non-gratuitous tail-study addition). Names match _BENCHMARK_NAMES exactly.
benchmarks: [equal_weight, mean_variance, risk_parity, hrp, minimum_variance, maximum_diversification, inverse_volatility, cross_sectional_momentum, min_cvar]

inference:
  primary_overfitting_guard: pbo_cscv
  deflated_sharpe: secondary
  # Amendment 2026-06-19 (R11): relabel "sharpe_ledoit_wolf" -> re-centred basic (empirical) stationary
  # block-bootstrap; the bootstrap SE cancels in the two-sided p-value (|boot-obs| >= |obs|), so size is
  # certified by null_calibration (audit C-7), not studentized. Numerics unchanged (label correction only).
  difference_tests: [sharpe_recentred_bootstrap, cvar_difference]
  bootstrap: stationary_politis_romano        # single-series tool (sharpe/cvar_difference_test)
  # Amendment 2026-06-20 (R16): the arm-contrast FAMILY difference tests aggregate ACROSS SEEDS via the
  # rliable per-seed method — per-seed Sharpe/CVaR -> IQM -> PAIRED stratified bootstrap over the shared
  # training seeds (paired_seed_difference_test), carrying the across-seed variance. This realizes the
  # `seed_reporting: rliable_iqm` intent AT the test and supersedes the prior seed-AVERAGED series
  # bootstrap (anti-conservative ~21% vs the correctly-sized ~5% true-null rejection, measured on a
  # 30-seed calibration sample — this is the method-calibration n, not the campaign winner count). The
  # re-centred convention (R11), the frozen family (R13, m=6), and the correction are unchanged.
  difference_test_unit: per_seed_iqm_paired_seed_bootstrap
  seed_reporting: rliable_iqm_poi_stratified_ci
  multiple_testing: romano_wolf_or_bh_fdr     # cross arm x metric family (audit B-8)
  multiple_testing_primary: benjamini_hochberg # BH q=0.05 primary; joint Romano-Wolf = FWER alternative (R13)
  multiple_testing_q: 0.05
  alpha_hurdle_t: 3.0    # ⚠ REGISTERED BUT NOT WIRED (verified 2026-07-26, deep review loop 6): a repo-wide
                       # search finds NO consumer of this key in src/ or scripts/. src/inference/attribution.py
                       # produces absolute alphas with HAC t-stats (`alpha_t`) but never applies a t>3 gate.
                       # So the Harvey-Liu hurdle is currently a dead registered rule: either wire it before
                       # any ABSOLUTE-alpha claim is made, or withdraw it by amendment. Disclosed, not hidden.                          # Harvey-Liu-Zhu — scoped to ABSOLUTE-alpha claims only (R13)
  alpha_hurdle_scope: absolute_alpha_claims_only
  trial_count_stated: true
  claim: comparative_not_beats_market
  # Amendment 2026-06-19 (R13): the realized multiple-testing family is ENUMERATED + FROZEN. It is exactly
  # what scripts/analyze_campaign.collect_family_pvalues enumerates: {arm-contrast x held-out-metric} =
  # 3 H2 contrasts x {Sharpe, CVaR-0.05} = m=6 (incl. the H2 distributional-vs-{scalar, placebo,
  # scalar_cvar5} legs). cvar_01 is opt-in (would grow m to 9), NOT in the frozen default family.
  # analyze_campaign/run_campaign assert the realized contrast set == this family (the `members` union).
  #
  # Amendment 2026-06-25 (R25): the HEADLINE decision is now TWO CO-PRIMARY intersection-union tests
  # (IUTs), NOT one m=6 BH family gated by a conjunction. Berger (1982): a conjunction IS an IUT and is
  # already the multiplicity correction (joint size <= max leg size = alpha), so the old
  # (conjunction o BH-over-6) DOUBLE-corrected and was under-powered against H2 (DEEP_H2 §3.2-3.3). The
  # m=6 enumeration below is UNCHANGED (still the frozen realized-family assert + the BH-over-6 REPORTED
  # SENSITIVITY); what changes is the GATE: it now partitions the 6 into two declared families, each
  # decided one-sided at alpha=0.05 with NO further leg correction (the IUT is the correction). `m: 6`
  # is retained as the union size (the Sidak selection-power multiplicity in scripts/power_analysis.py
  # ranges over all 6 enumerated tests).
  testing_family:
    m: 6                                        # UNION size (BH-over-6 sensitivity + Sidak multiplicity)
    structure: two_co_primary_iut               # R25: H2-RA (Sharpe) + H2-Tail (CVaR-5%), each its own IUT
    decision_rule: per_family_iut_one_sided_no_leg_correction   # the conjunction IS the correction (Berger 1982)
    alpha_one_sided: 0.05                        # each IUT leg decided one-sided in the predicted direction
    bh_over_6: reported_sensitivity_not_gate     # R25: BH over the m=6 union is REPORTED, never the gate
    contrasts:                                 # (a, b) read "a predicted better than b"
      - [distributional, scalar]
      - [distributional, placebo]
      - [distributional, scalar_cvar5]
    metrics: [sharpe, cvar]
    cvar_levels: [0.05]                         # headline alpha; cvar_01 opt-in (high-variance, EVT)
    # The TWO co-primary IUTs (R25). Each is supported iff ALL THREE of its legs reject one-sided at
    # alpha=0.05 in the predicted direction (distributional strictly better). H2-Tail is additionally
    # CORROBORATED (not gated) by the FZ0/(VaR,ES) comparative ES backtest where available.
    families:
      h2_ra:                                    # risk-adjusted-performance IUT (DEEP_H2 §7.1)
        m: 3
        metric: sharpe
        members:
          - {arm_a: distributional, arm_b: scalar,       metric: sharpe, level: null}
          - {arm_a: distributional, arm_b: placebo,      metric: sharpe, level: null}
          - {arm_a: distributional, arm_b: scalar_cvar5, metric: sharpe, level: null}
      h2_tail:                                  # tail-outcome IUT (DEEP_H2 §7.1)
        m: 3
        metric: cvar
        level: 0.05
        corroborated_by: fz0_var_es_comparative_backtest   # reported, NOT a gate
        members:
          - {arm_a: distributional, arm_b: scalar,       metric: cvar, level: 0.05}
          - {arm_a: distributional, arm_b: placebo,      metric: cvar, level: 0.05}
          - {arm_a: distributional, arm_b: scalar_cvar5, metric: cvar, level: 0.05}
    members:                                    # the m=6 enumerated UNION (frozen realized-family assert)
      - {arm_a: distributional, arm_b: scalar,       metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: scalar,       metric: cvar,   level: 0.05}
      - {arm_a: distributional, arm_b: placebo,      metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: placebo,      metric: cvar,   level: 0.05}
      - {arm_a: distributional, arm_b: scalar_cvar5, metric: sharpe, level: null}
      - {arm_a: distributional, arm_b: scalar_cvar5, metric: cvar,   level: 0.05}
  # Amendment 2026-06-19 (R12): SESOI + symmetric TOST equivalence margin for the headline H2 contrast.
  # Amendment 2026-07-25 (R104): the SESOI VALUE (0.05 DSR) is UNCHANGED; its JUSTIFICATION is upgraded from
  # ASSERTED to DERIVED — the economic band in sesoi_derivation below (docs/SESOI_DERIVATION_2026-07-25.md).
  # 0.05 DSR = 0.0756 ann-Sharpe (k=0.6616 DSR/ann-Sharpe, T=694; CAMPAIGN_power.md T2.5) sits INSIDE
  # [cost-breakeven 0.0055, practitioner-material 0.10] -> exploitable-after-costs AND stricter-than-practitioner.
  sesoi: 0.05                                   # validation-DSR units
  equivalence_margin: 0.05                      # symmetric TOST margin (+/- DSR)
  sesoi_derivation:                             # R104 (2026-07-25): DERIVES sesoi=0.05 (was asserted). tests/test_sesoi_derivation.py binds this band.
    dsr_per_ann_sharpe: 0.6616                  # k (delta-method ceiling, z=0, T=694): DSR = k * ann_Sharpe (CAMPAIGN_power.md T2.5)
    sesoi_ann_sharpe_equiv: 0.0756              # = sesoi / k  (0.05 DSR -> 0.0756 ann-Sharpe)
    book_sigma_ann: 0.202                       # equal-weight T0 book annualised vol, MEASURED (data/gold/returns_panel_univ5)
    book_turnover_ann_oneway: 1.12              # equal-weight daily-rebalanced one-way turnover per yr, MEASURED
    cost_bps_oneway: 10                         # env transaction cost, one-way bps (must match environment cost)
    lower_bound_cost_breakeven_sharpe: 0.0055   # = cost_bps*1e-4 * turnover / sigma; below this an edge is unexploitable-after-costs
    upper_bound_practitioner_sharpe: 0.10       # a deliberately-CONSERVATIVE practitioner-material heuristic (ann-Sharpe); basis below
    practitioner_floor_basis: "0.10 ann-Sharpe = a conservative practitioner heuristic. DeMiguel-Garlappi-Uppal 2009 gives the QUALITATIVE '1/N is remarkably hard to beat' result; their tabulated 0.10-0.20 is MONTHLY (~0.35-0.69 annualised, Lo 2002), so 0.10 ANNUALISED is conservative. Corroborated by Lo 2002 (Sharpe-distinguishability) + Harvey-Liu-Zhu 2016 (t>3). No canonical '0.10-0.20 ANNUALISED' cite exists -> a stated conservative synthesis; correcting the unit only STRENGTHENS conservativeness (SESOI 0.0756 sits a fortiori below)."
    verdict: sesoi_inside_band                  # 0.0055 < 0.0756 < 0.10 (exploitable-after-costs AND conservative)
    source: docs/SESOI_DERIVATION_2026-07-25.md
  # Amendment 2026-06-25 (R26/R30/R31): the PRE-REGISTERED report-only SECONDARY families. ALL use keys DISJOINT
  # from the frozen m=6 above, so analyze_campaign.assert_realized_family_matches_frozen is untouched; each is
  # computed + reported but NEVER gates H2. Pre-registering them BEFORE the sealed-test freeze is what pre-empts
  # the "your edge is just BAB/low-vol" recast (R26; LIMITATIONS_REGISTER L15) and makes H3/H4 campaign-grade (R30).
  secondary_families:
    factor_attribution:                         # R26 — difference-in-alpha vs the factor ladder (the BAB/low-vol pre-empt)
      key: attribution
      ladder: [capm, ff3, carhart4, ff5, ff6, ff6_bab, ff6_bab_qmj]
      statistic: difference_in_alpha_paired_across_seed   # Newey-West (1994) HAC SE; BH WITHIN this family
      controls_for: [market, size, value, momentum, profitability, investment, betting_against_beta, quality]
    h3_iterative_vs_singleshot: {key: h3, statistic: per_seed_iqm_paired, equivalence: tost_0.05}   # R30
    h4_search_controls: {key: h4, tests: [h4a_vs_random_search, h4b_vs_bayes_opt, h4c_vs_cma_es, h4d_vs_tpe], correction: bonferroni_4}   # R30; +cma_es/tpe 2026-07-26 (the separate-estimands mirror of the N4 portfolio IUT)
    h2_tost_equivalence: {key: h2_tost, margin: 0.05, units: test_statistic}   # R29/R30 — the bankable-null bound
    h2_structure_control:                       # R32 — the format-vs-content structure control (Gupta-Hartford)
      key: h2_structure
      arm: placebo_shuffled                     # the 5th LLM arm: distributional's EXACT block, values DERANGED
      contrast: [distributional, placebo_shuffled]
      metrics: [sharpe, cvar]
      cvar_level: 0.05
      decision: one_sided_both_legs_content_over_format
      gates_h2: false                           # DISJOINT from the frozen m=6 union — reported, NEVER a gate
    dsr_effective_n: {key: dsr_effective_n, report_only: true}   # R30 — sequential-reflective correlation sensitivity
    cross_hypothesis_multiplicity: {key: cross_hypothesis_multiplicity, stance: separate_estimands_bonferroni_4_sensitivity}  # R31 = the CURRENT DEFAULT; R105 registers a conjunctive-validity graphical-FWER UPGRADE (inference.validity_tier) that supersedes this ON supervisor ratification before the freeze
    delisting_band:                             # R33 — the delisting-return sensitivity band (DATA-level; DISJOINT)
      key: delisting_band
      panel: univ4                              # the Shumway panel carrying the 333 delisting cells (NOT the headline — univ5 is, R73); band overwrites
                                                #   them. The univ4-era panel ends 2025-12, so under Split C the band CLAMPS its window to the overlap
                                                #   and records the clamp (analyze_campaign.delisting_band); ADR-051 located the truth AT the 0% end
                                                #   (univ5s == univ5: 333/333 vendor terminals kept, zero surcharges; univ4 = M&A contamination +
                                                #   terminal double-count).
      grid: [0.0, -0.30, -0.55, -1.00]          # delisting-return d applied to the 333 test-window cells; univ4=-30/-55 = the structural extreme
      metrics: [cvar_05, cvar_01]               # pooled tail recomputed per d (DATA-level, NO policy re-run)
      report_only: true
      gates_h2: false                           # DISJOINT from the frozen m=6 union — reported, NEVER a gate
  # ---- R67 JZS prior pin, MIRRORED 2026-07-26 (ratification item 7c; Tamer + Okhrati) ------------
  # R67 pins the ONE researcher degree of freedom in the Bayesian null complement -- the Cauchy prior
  # scale -- and requires it to be PINNED before the freeze for the complement to be confirmatory.
  # It WAS pinned, but in PROSE ONLY: config/preregistration.yaml carried no `jzs`/`prior`/`bf_threshold`
  # key, so scripts/freeze.py's prose<->yaml assertions could not check it (they can only compare fields
  # present on BOTH sides), unlike the SESOI, the equivalence margin and the m=6 family. The hash binds
  # the prose bytes, so the VALUE could never move silently -- what was missing was the check that would
  # catch the CODE drifting from the registered value. Mirrored here; the code<->yaml drift guard lives
  # in tests/test_bayes_null.py (deliberately NOT in freeze.py, which stays import-light: pulling
  # src/inference/bayes_null.py into the gate would drag scipy in at freeze time).
  bayes:
    prior_scale_r: 0.7071067811865476          # sqrt(2)/2 — the BayesFactor "medium" default (R67); == src/inference/bayes_null.DEFAULT_R
    prior_scale_grid: [0.5, 0.7071067811865476, 1.0, 1.4142135623730951]   # {0.5, sqrt(2)/2, 1, sqrt(2)} — the MANDATORY robustness band; == bayes_null.R_GRID
    bf_threshold: 3.0                          # == the bayesian_null_report default; the null is "supported" only ACROSS the whole grid
