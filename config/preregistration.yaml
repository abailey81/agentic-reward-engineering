    t0_filter_size_note: "the inclusion filter is ARM-SYMMETRIC (both arms must clear the same floor), so it preserves the sign-flip symmetry of the null — filtering cannot bias the permutation test's size (registered so the selection-then-test question is answered ex-ante)"
