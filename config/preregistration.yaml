    sensitivity: [romano_wolf_graph, bh_fdr_over_m6]     # retained power sensitivity + cross-metric disclosure (benjamini1995fdr, romanowolf2005stepwise)
    excludes: [H1_snooped_test_max]             # the SNOOPED reading (pick the max-over-the-sealed-TEST hand-reward, then test the LLM against THAT one) has no valid node p-value -> excluded; the snoop-free formalization -- the IUT that requires the LLM to beat EVERY hand-reward (== beat the best, no comparator selected, nothing to snoop) -- IS confirmatory node N6 (2026-07-26, Tamer "beats the human, smart")
    forking_path_guard: "the ENTIRE graph (nodes/weights/edges/tests/directions/endpoints) is FROZEN before the sealed leg; topology principled + symmetric (headline-first; H3<->H4 symmetric), NOT engineered around any prototype outcome; no prototype number enters the dissertation"
    ratification_pending: []                    # R108 (2026-07-26): EMPTY - all items below were signed off by Tamer AND Okhrati.
    ratification_completed: [conjunctive_claim, graphical_primary_vs_bh_primary, alpha_allocation, n4_h4_confirmatory_portfolio, n5_structure_node, n6_h1_confirmatory_node, h1_canon_expansion_4_to_11, cpu_randomised_device_block, uniform_reasoning_off_and_matched_caps]   # ★ R106 (2026-07-27) REPAIR: `uniform_reasoning_off_and_matched_caps` was ITEM 8 of the ratification pack and was signed off with the rest ("me and Okhrati ratify everything", 2026-07-26) -- but it was omitted from this list AND from ratification_pending, so it was recorded as neither done nor outstanding and never reached config/legs.yaml. Exactly the R84 failure mode (a registered NAME needs a registered VALUE) with the name lost too. Implemented + re-listed here.   # R108: the full set ratified 2026-07-26 by Tamer + Okhrati. n4 = H4 report-only -> confirmatory beat-the-max 4-optimiser portfolio {random, GP-EI, CMA-ES, TPE} + the 7->9 arm roster. cpu_randomised_device_block = the CPU lane admitted as a device BLOCK level alongside V100/A100: device is a nuisance factor, every CRN comparison unit stays device-HOMOGENEOUS (seed-pool blocks), so the device cancels in each paired difference; an ALL-CPU campaign is single-substrate and needs no blocking at all.
    ratification_pack: docs/RATIFICATION_PACK_2026-07-26.md   # ★ THE SIGN-OFF DOCUMENT (2026-07-26): one page per pending item -- what changed, WHY, the MEASURED cost, what it buys, and a recommendation, with a sign-off table. Written because the blocker to ratification was that no single artifact stated what needed ratifying. Covers every entry in ratification_pending above PLUS the three open reconciliations (leg_calendar_gate vs the Aug-27 uniform stop; the capability anchor being non-estimable at 2/10 legs; the prose-only JZS prior pin) and R106. Read this FIRST when seeking sign-off.
    per_node_strength: docs/VALIDITY_TIER_DESIGN_2026-07-26.md   # the evidence + power + non-fragility guard PER confirmatory node (Tamer 2026-07-26: additions must be very strong + non-fragile)
    candidate_upgrades:                         # 2026-07-26 upgrade analysis (docs/VALIDITY_TIER_DESIGN_2026-07-26.md #upgrade-analysis)
      n6_h1_dominates_canon: "PROMOTED 2026-07-26 to CONFIRMATORY node N6 (Tamer nothing-frozen; h1_baselines ALSO expanded 4->11 = the full canon). CLAIM (Tamer 2026-07-26, 'make it smart + sound'): 'the LLM-designed reward DOMINATES the human hand-reward canon' -- the precise, snoop-free reading of 'beats the best human'. THE SUBTLETY that makes it smart: 'the best hand-reward' is not nameable a priori -- it is the pointwise MAX over the canon, and naming it by the sealed-test result IS the White-2000 comparator data-snoop that forced the OLD H1 to descriptive-only. TWO fixes were possible: (a) val-select the champion + score on test -- REJECTED: DEAD CODE (run_campaign._baseline_winner_record archives val_fitness=NaN, so no baseline carries a val signal and beat_human_baseline already falls back to the test-snoop) AND it needs a fragile new baseline val-roll. (b) ADOPTED, smarter + non-fragile: DOMINATING the canon (beating EVERY member) is logically equivalent to beating the max (the best), but selects NOTHING -> snoop-free by construction. Formalized as an INTERSECTION-UNION TEST (berger1982iut): the node rejects iff the LLM beats all 11 hand-rewards each at level alpha; IUT p = max over the 11 one-sided leg p-values. Level-alpha for free, conservative, consistent with the H2 co-primary IUTs. REPORTED WITH the dominance PROFILE (per hand-reward: significantly-beaten / statistically-tied / lost, + effect sizes) -- the honest structure beneath the binary (beats 9/11, ties the DSR, loses to none is richer + more mature than a bare verdict). CONSERVATISM IS A VIRTUE: the LLM DSR is deflated by its search multiplicity (N=30) while each human is N=1, so the human bar is conservatively HIGH -- dominating it anyway is strong. Canon-as-champion (full standard toolkit = the bar; a first in the LLM-reward-design lineage, which compared against a single hand-baseline). ★ STATUS, corrected 2026-07-27 pre-freeze: NO LONGER A CANDIDATE -- it was RATIFIED as confirmatory node N6 on 2026-07-26 by Tamer AND Okhrati (`n6_h1_confirmatory_node` + `h1_canon_expansion_4_to_11` in ratification_completed), and R111 then set its seed depth to climb the ladder. The trailing 'Registered as CANDIDATE ... -> ratification' was stale text describing the proposal that this same paragraph records as ADOPTED; left in place it would have been FROZEN into the design of record contradicting the ratification list eight lines below."
    source: docs/VALIDITY_TIER_DESIGN_2026-07-26.md

