# ---- 2026-07-01 RATIFIED amendment: mechanism-headline reframe (PREREGISTRATION.md §2a) ----
# Report-only, DISJOINT from the frozen m=6 testing family (does NOT gate H1-H4; keys disjoint from the
# inference family). Foregrounds the MECHANISM as the dissertation's headline: does showing the LLM the
# downside change the reward CODE it writes, and does it propagate to the realized tail? A null LOCATES
# where the chain breaks. Robust to the sigma_D pilot: the mechanism headline holds whether H2 lands as
# equivalence OR non-rejection.
mechanism:
  report_only: true
  disjoint_from_m6: true
  research_question: does_fed_tail_change_authored_code_and_propagate_to_realized_tail
  causal_chain: [fed_tail_signal, authored_reward_code, trained_policy, realized_tail_outcome]
  sub_questions:
    sq1_responsiveness:
      question: does_the_fed_signal_move_the_code
      instrument: [responsiveness_spearman_bootstrap, reward_program_differential]
      predicted_direction: positive_if_channel_acts     # prototype responsiveness was negative -> predicted break HERE
    sq2_transmission:
      question: does_the_code_move_the_outcome
      instrument: mediation_fed_to_code_to_outcome_indirect_bootstrap
      note: if_sq1_null_then_indirect_zero_for_any_b     # the chain severs at link 1
    sq3_specificity:
      question: genuine_use_of_tail_content_vs_surface_echo
      instrument: [named_vs_blinded_structural_ast, legible_format_responsiveness_differential]
  numeracy_bottleneck:                  # the headline reframe (ADR-039)
    hypothesis: sq1_failure_is_partly_a_numeric_legibility_bottleneck   # close small floats ~50-70% (arXiv 2602.07812; NUMCoT 2406.02864)
    ablation: legible_format_differential   # positive CI-separated legible-minus-raw gap CONFIRMS; null REFUTES
  fingerprint_accounts:                 # §2a(f); A5 added by Amendment R76 (2026-07-11, pre-freeze/pre-data)
    [a1_genuine_use, a2_readout_illegibility, a3_execution_failure, a4_prior_dominance, a5_rational_insensitivity]
  fed_delta_snr_exhibit:                # §2a(h), R76: report-only, archive-computed (R61 cvar_ci machinery)
    resolvable_signal_share: reported   # share of fed deltas > 2x their PAIRED block-bootstrap SE (common-path pairing)
    attenuation_sensitivity: reported   # disattenuated SQ1 responsiveness — a SENSITIVITY, never the primary
    snr_conditioned_responsiveness: reported   # SQ1 on high-SNR vs sub-noise delta subsets (the A5 fingerprint row)
    a5_vs_a2_adjudicator: ci_annotated_re_rendering_d2plus_iv   # Stage-2; the format-only differential remains the A2 ablation
  robust_to_sigma_d: true               # the mechanism headline does NOT depend on the equivalence-vs-non-rejection pilot outcome
  # ---- 2026-07-26 (search-adequacy research): defend the predicted NULL against "you didn't search hard   ----
  # enough". Our search is K=5/gen x 6 gen = 30 candidates/arm (~1/13 Eureka's 400/task, honestly BELOW the
  # field norm). Pre-committing these rules BEFORE unblinding is what makes the adequacy check SEVERE (mayo).
  null_severity_decomposition:          # the "would-have-caught-it" probability = ALL THREE legs high (mayo2018severetesting; altman1995absence)
    leg1_responsiveness_power: met_by_750_authoring_subexperiment   # config/subexperiment.yaml + responsiveness_positive_control -> UPSTREAM of + independent of the 30-candidate search
    leg2_search_adequacy: instrumented                             # the ONLY leg K=5 threatens -> the search_adequacy exhibit converts it from an assertion into a pre-committed bound
    leg3_equivalence_seed_power: met_by_E1_seed_ladder             # the assurance-tier ladder to n=568 (equivalence/superiority power)
    reviewer_attack_lands_on: leg2_only                            # the decomposition localises the attack to exactly one instrumented leg
  sq1_upstream_of_search_width: true    # HOLDS for the MECHANISM headline, NOT for H2 equivalence: under a tail-blind selector more i.i.d. candidates (larger K) sample the SAME p(code|fed) more densely -> cannot manufacture an a=0 dependence nor reverse an a<0 one (if_sq1_null_then_indirect_zero_for_any_b). A responsiveness null locates the break at link-1 INDEPENDENT of K -> search-exhaustiveness is moot for the content claim. H2 performance-equivalence is a SEPARATE leg where K=5 is a DISCLOSED residual (APPENDIX_B B.3.3).
  search_adequacy:                      # the pre-committed report-only EXHIBIT (~80% already coded; disjoint from m=6)
    best_so_far_saturation: recommend_candidates_plateau_verdict   # per-arm val-DSR best-fitness vs gen 1-6 + the pre-committed patience=2 plateau rule (determine_design.recommend_candidates); a "still-rising" verdict is DISCLOSED as a bounded limitation (the prototype flagged the scalar arm still-rising -> re-run on the real campaign + disclose, never bury)
    executable_valid_rate: reported     # fraction of K=5/gen authorings passing AST-gate + contract + error-free run (Eureka exec-filter analogue); high rate => effective search ~= nominal 30
    oracle_headroom: reported           # best searched-LLM val-DSR minus (a) the 11-canon hand-reward max (N6) and (b) the pooled best across arms; small residual => headroom exhausted (adequacy shown), large => budget-limited (disclosed)
    within_generation_diversity: reported   # pairwise EPIC/STARC distance among the K=5 per-gen candidates -> guards the K-collapse failure (prompt-variation -> near-duplicates -> effective width < 5)
