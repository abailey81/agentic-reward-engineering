# Advanced 40-candidate prototype (MASTER_EXECUTION_PLAN Part I). DIRECTIONAL / plumbing-only:
# its measured tails are biased by the provisional liquidate_to_cash delisting fill + the held
# 2005 cohort, so NO prototype number enters the dissertation (review M3/M4) — it de-risks the
# machinery before the campaign. Built + verified; the full run is gated on the user.
#
# Matched compute across all six arms is enforced by generations*candidates_per_gen = 40 per arm
# (the orchestrator asserts accepted+failed == 40; the loop's `budget` field is cosmetic — review M2).

arms: [distributional, scalar, placebo, scalar_cvar5, random_search, bayes_opt]

candidates_per_arm: 40            # the user-set advanced budget (> blueprint 30, > campaign 30)
generations: 8                    # 8 x 5 = 40 reflection generations (deeper than the campaign's 6x5 -> stronger H3)
candidates_per_gen: 5             # DERIVED at runtime as candidates_per_arm // generations (40//8); shown for clarity, NOT read directly (final-audit #27)
single_shot_generations: 1        # H3 single-shot control = a SEPARATE run launched with generations:1 (not auto-wired from this key; final-audit #27)
seeds: [0]                        # 1 seed -> DIRECTIONAL only (Henderson 2018); rliable multi-seed in the campaign
n_trials: 40                      # Deflated-Sharpe expected-max correction = per-arm candidate count (review M1)

data:
  # CAMPAIGN-LIVE block (SPLIT C, ADR-044 — executed 2026-07-02): run_campaign's SEARCH stage threads
  # this block into the panel/window builders (run_winner_search -> build_parallel_opts -> parallel.
  # _panel_and_windows; the serial run_arm path reads it too), so it carries the ACTIVE Split-C dev
  # splits. The EXECUTED 2026-06-21 directional prototype ran the pre-Split-C splits (2005-14/15-17
  # on univ3) — its archived records are unaffected.
  universe: univ5                 # documentation only — the ACTIVE panel selector is config/data.yaml:
                                  #   gold.suffix (read by loaders.gold_suffix()); this key is not read
                                  #   by code. univ5 = returns_panel_univ5, sha256 7cf5d98 (ADR-051).
  phase: development              # dev top-30 (2005 selection); see the PIT-simplification caveat above
  val_end: "2019-12-31"           # load train(2005-2016)+val(2017-2019); split at the train/val boundary
  train_end: "2016-12-31"
  on_missing: liquidate_to_cash   # PROVISIONAL (ADR-024) — directional prototype only

agent:
  algo: sac                       # the FIXED headline agent (audit A-1)
  train_steps_per_candidate: 25000  # prototype-scale budget; MATCHED across arms. The CAMPAIGN'S B* is
                                    #   400,000 (R77 measured knee, supersedes R74's 200,000); campaign on UCL
                                    #   Myriad (ADR-053), laptop RTX 4050 fallback. The old '50k on the
                                    #   rented 4090' framing is superseded). Set from Phase-0 m (~18.9 min/50k).
  buffer_size: 25000              # == train_steps (memory-safe; ADR-025)
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  ent_coef: auto
  learning_starts: 1000           # warm-up steps before the critic regresses. SB3's UNSET default is 100,
                                  #   but the Phase-0 GATE (scripts/smoke_test.py) validated 1000 — set it
                                  #   here so the study trains under the gated warmup (was a silent 100 leak).
  popart: true                    # PopArt-style value-target SCALE normalization (src/agents/popart.py): the
                                  #   SAC critic is made invariant to the reward's SCALE so a variance-floored
                                  #   Sharpe (|reward| ~ 1e4) can't blow the Q-target to ~1e6 and explode the
                                  #   critic loss. Divides ONLY the learning signal; info["port_ret"] (the object
                                  #   of study) is unchanged so norm_reward stays False. Applied uniformly across arms.
  normalize_obs: true             # train-only VecNormalize (deep-research §2)
  tf32: true                      # TF32 matmul precision (Ampere/Ada); applied by train_agent UNIFORMLY (serial/SEARCH/TEST)
  device: cuda                    # GPU ~3x faster here (ADR-030: 96 vs 34 steps/s single); GPU saturates ~185 agg

parallel:
  # MAX-throughput path (--parallel): a device-load-balanced candidate pool (src/orchestration/parallel.py).
  # CALIBRATED (scripts/bench_compute.py, 2026-06-18): on this RTX 4050 laptop the GPU SATURATES at
  # ~185 steps/s aggregate (3 workers=183, 5 workers=193 -- essentially flat), and CPU training workers
  # are both useless (threads=1 -> ~5 steps/s each, ~19x slower than the GPU) AND HARMFUL (they starve
  # the GPU's env-step/feed threads: 3 GPU alone=186, but 3 GPU + 8 CPU=143). So the optimum is GPU-ONLY.
  n_gpu: 2                        # COMFORTABLE-SAFE on this 15 GB laptop (measured 2026-06-20). RAM showed TWO
  #                                 failure layers: (1) n_gpu=4 OOM'd at the first candidate-TRANSITION wave (4
  #                                 simultaneous 181 MiB buffer allocs at ~92% -> MemoryError cascade, 52 failed);
  #                                 (2) n_gpu=3 survived the wave (trough ~83%) but its peak CREPT 89.6 -> 91.6 ->
  #                                 96.3% over ~25 min from heap FRAGMENTATION in the persistent pool workers (each
  #                                 candidate alloc/frees a 0.36 GiB buffer) -> spiked into the OOM zone. n_gpu=2
  #                                 (~75% base) ABSORBS both the wave and the creep (peak ~83-85%, ~2.5 GiB free).
  #                                 Only ~11% slower than n_gpu=3 (GPU-shared: 178 vs 200 agg steps/s).
  max_tasks_per_child: null       # DISABLED -- recycling workers WOULD bound the creep, but max_tasks_per_child
  #                                 HANGS on Python 3.11.9 + Windows spawn (CPython bug; verified deadlock 2026-06-20).
  #                                 null = persistent workers (the proven path); n_gpu=2 is the RAM lever instead.
  n_cpu: 0                        # CPU training workers DISABLED -- they STARVE the GPU's feed threads (harmful)
  # => full 240 x (25k train + ~3k eval) prototype ~ 17 h at 2-way concurrency on this laptop. The single GPU +
  # 15 GB RAM are the hard ceiling; BOTH the transition wave AND the fragmentation creep are the binding limits.
  # Simple arm-level path (default): one process per arm.
  p_arms: 2                       # concurrent NON-daemon arm processes (review m2)
  device_per_arm: cuda            # NOTE: the parallel scheduler uses its OWN GPU device-token pool; this key is not read (final-audit #27)

llm:
  # PROTOTYPE reward-author = Anthropic Claude Sonnet 4.6 (ADR-038, user-selected 2026-06-20; supersedes the
  # ADR-035 Gemini 3.5 Flash pick). The prototype OWNS its author (run_arm reads this block; the campaign
  # threads its OWN — config/campaign.yaml: llm = Opus 4.8). Sonnet uses the NATIVE Anthropic transport
  # (prompt-cache + token-usage archival, ADR-016/033), same ANTHROPIC_API_KEY as the campaign.
  pass: B                         # 'B' = real LLM (Sonnet 4.6); 'A' = keyless StubDesignerTransport (free machinery test)
  provider: anthropic             # stub | anthropic | gemini | openai | deepseek | openrouter  (provider-neutral transport, ADR-035; openrouter added 2026-07-02 for the R71 Qwen secondary)
  model_snapshot: "claude-sonnet-4-6"   # pinned dateless id (immutable, ADR-016); native Anthropic SDK transport
  api_key_env: ANTHROPIC_API_KEY        # key in gitignored .env (loaded by build_transport); read from env, NEVER committed
  temperature: 1.0                      # Eureka K-sample diversity — Sonnet 4.6 HONORS temperature (Anthropic max=1.0),
                                        # so within-generation variety comes from sampling. Campaign Opus 4.8 instead
                                        # rejects temperature -> uses prompt-variation; Sonnet does not need that.
  diversity_prompt_variation: false     # not needed: temperature=1.0 gives the within-generation variety on Sonnet

reward_family:                    # H4 BO-over-template search space (mirrors eureka_loop.yaml: reward_family)
  weights:
    w_return:   {low: 0.0, high: 2.0}
    w_log:      {low: 0.0, high: 2.0}
    w_turnover: {low: 0.0, high: 0.02}
    w_drawdown: {low: 0.0, high: 0.1}
    w_cvar:     {low: 0.0, high: 5.0}
    w_vol:      {low: 0.0, high: 2.0}
  cvar_alpha: 0.05                # FIXED for the prototype (discrete dim; BO box is continuous)
  window: 20                      # FIXED for the prototype

output_dir: outputs/prototype     # per-arm archives (write_run records) + a run summary JSON
resume: true                      # skip arms already marked complete (arm-level resume)
