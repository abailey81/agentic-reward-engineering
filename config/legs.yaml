  - label: sonnet-5
    provider: anthropic
    model: claude-sonnet-5                 # R90/R92: the LATEST-GENERATION seat (released 2026-06-30); the generation-pair instrument is now the conditional Opus pair (R91/R92)
    api_key_env: ANTHROPIC_API_KEY
    reasoning: {enabled: false}            # R106: see haiku-4.5 - was off by vendor default, now PINNED
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more
  - label: gemini-2.5-flash
    provider: openrouter
    model: google/gemini-2.5-flash         # R106 (2026-07-27) SUBSTITUTION: gemini-3.5-flash -> gemini-2.5-flash. 3.5-flash's reasoning is MANDATORY (OpenRouter 400: "Reasoning is mandatory for this endpoint and cannot be disabled", verified 2026-07-25), so it was the ONE leg that could not join a uniform-off suite. The substitute was VERIFIED 2026-07-25 (disables reasoning, meaningful risk-aware code, 83% sandbox gate-pass) and RE-VERIFIED live 2026-07-27 before this swap: id resolves, served by Google, reasoning_tokens 0 under the disable pin, stop=stop, 802 output tokens, `def reward` authored. Keeping 3.5-flash would have forced a permanent exception to the ratified uniform-off design
    api_key_env: OPENROUTER_API_KEY
    reasoning: {enabled: false}            # R106: the whole point of the substitution — this leg CAN disable, and the disable ROUND-TRIPS (0 reasoning tokens measured)
    temperature: 1.0
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more
