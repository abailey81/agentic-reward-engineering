# EXECUTED leg config (v2, R80/R82/R84/R85) — must match config/preregistration.yaml `model_suite`
# (the freeze-gate cross-check assert_leg_roster_match binds them; NOTHING is frozen at this
# stage — 2026-07-21). Two transports only: anthropic + openrouter.
# Rolling "~*/-latest" aliases are BANNED. max_tokens pinned per R82 (provider defaults differ —
# silent-truncation guard). temperature: 1.0 pinned on OpenRouter legs per R85 (uniform decoding
# across legs — providers default differently; models that REJECT the param fall back to provider
# default, disclosed from the gate smoke). hf_pin (R85): the open legs' PERMANENT weights anchor —
# repo + commit retrieved from the official HF card AT GATE TIME (never inferred/fabricated),
# FILLED 2026-07-22 from the official HF API (R93 freeze-day record; licenses re-verified: MIT/MIT/Apache/Apache/OML)
# (see model_suite.hf_weights_pins). Costs are ceiling-planning estimates, not authorities.

legs:
  - label: deepseek-v4-pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro
    api_key_env: OPENROUTER_API_KEY
    reasoning: {enabled: false}            # R106 (2026-07-27) UNIFORM REASONING-OFF — ratified with the supervisor on 2026-07-26 (pack item 8) and implemented here. Was {mode: pro}: MEASURED 2/10 authoring calls truncated at 4096 with one spending the ENTIRE budget on hidden reasoning (ZERO tokens for code). R113 raised the cap to 8192 to PRESERVE that pin; R106 SUPERSEDES that reasoning — the pin itself goes off, so the suite is comparable and the masking confound (a reasoning scratchpad can silently reformat the fed floats, contaminating the numeracy headline) is removed
    temperature: 1.0                       # R85 uniform decoding pin
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more
    hf_pin: {repo: deepseek-ai/DeepSeek-V4-Pro, commit: b5968e9190ef611bbf34a7229255be88a0e937c1}   # retrieved 2026-07-22, official HF API   # R85: filled from the official HF card at gate time
    gate: contamination_screen             # fallback: glm-5.2 absorbs this seat
  - label: glm-5.2
