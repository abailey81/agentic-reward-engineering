    provider_pin: {only: [siliconflow], allow_fallbacks: false}
    quantizations: [fp8]                   # pair invariant: SAME provider + quant as qwen3.5-9b (the served artifact is the fp8 variant of the pinned weights — model_suite.served_variant_disclosure)
    reasoning: {enabled: false}            # R103 (2026-07-25) repro-gate FIX: siliconflow serves Qwen3 in THINKING mode by default, burning the whole output budget on hidden reasoning -> EMPTY authored code (0.4/10 compliance at the frozen config). Disabling thinking VERIFIED 0.4->1.0. A DISABLE pin: leg_gates verifies ~0 reasoning tokens served (client.py now captures reasoning_tokens). PAIR INVARIANT: identical reasoning config across the qwen pair
    temperature: 1.0
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more
    hf_pin: {repo: Qwen/Qwen3.6-27B, commit: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9}   # retrieved 2026-07-22, official HF API
  - label: qwen3.5-9b
