  - label: kimi-k3
    provider: openrouter
    model: moonshotai/kimi-k3-20260715     # R95: the CANONICAL DATED slug (verified on OpenRouter 2026-07-22 — stronger pinning than the undated closed legs); always-on thinking disclosed; weights due 2026-07-27 upgrade this to open-class (hf_pin filled by rule)
    api_key_env: OPENROUTER_API_KEY
    reasoning: {enabled: false}            # R112 (2026-07-26) repro-gate FIX: the R97a cap bump 4096->8192 was NOT enough — 3/12 compliance calls still spent the WHOLE 8192 on hidden reasoning (reasoning_tokens 8189, stop=length, EMPTY code), and a passing call used 7004, so 8192 was marginal by construction. The "always-on thinking" premise was FALSE (mapped 2026-07-25, re-VERIFIED live here 3/3: 0 reasoning tokens, ~550 output tokens, code authored) — so the correct lever is DISABLE, not a bigger budget, which also cuts this leg's cost ~15x
    temperature: 1.0
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more

