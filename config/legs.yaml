    model: claude-haiku-4-5-20251001       # dated snapshot — best-pinned leg after Opus
    api_key_env: ANTHROPIC_API_KEY
    reasoning: {enabled: false}            # R106: Anthropic legs carried NO reasoning key, so they were off by VENDOR DEFAULT rather than pinned - and R102's 'Opus 5 runs adaptive thinking by default' was proved empirically FALSE, which is exactly how an unpinned default diverges from the registration. Mapped to Anthropic's thinking:{type:disabled} by src/llm/legs.py; VERIFIED ACCEPTED live on opus-5/haiku-4.5/sonnet-5 before the mapping was added
    max_tokens: 16384                      # R106 uniform cap RAISED 8192 -> 16384 (2026-07-27: "raise the cap for everyone just to stay safe"). MEASURED at 8192 with reasoning off: 10 of 11 models used 7-32% of the cap, but the CONFIRMATORY Opus author used 78% (6412 tokens on 10 calls) - squarely in the 54-82% "marginal BY CONSTRUCTION" band deepseek's truncation defined, on a small sample. 16384 VERIFIED ACCEPTED live on ALL 11 models before the change. Costs nothing: billing is on tokens GENERATED, and the legs at 7-32% will not generate more
